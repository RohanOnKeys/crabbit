[package]
name = "crabbit"
version = "0.1.0"
edition = "2021"
description = "A fast, memory safe web search engine with cursor based pagination"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time"] }
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
memmap2 = "0.9"
rust-stemmers = "1"
base64 = "0.22"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
criterion = "0.5"

[[bench]]
name = "query_bench"
harness = false
